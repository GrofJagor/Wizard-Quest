services:
  # 1. Microsoft SQL Server Database
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Tr0pSk4_Pt1c4#99
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  # 2. NestJS Backend (TypeORM)
  backend:
    build:
      context: ./quest-wizard-api
      dockerfile: Dockerfile
    container_name: quest-wizard-api
    ports:
      - "3000:3000"
    env_file:
      - ./quest-wizard-api/.env
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - app-network

  # 3. Angular Frontend
  frontend:
    build:
      context: ./Quest-Wizard
      dockerfile: Dockerfile
    container_name: Quest-Wizard_frontend
    ports:
      - "80:80"
    volumes:
      - ./Quest-Wizard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

volumes:
  mssql_data:

networks:
  app-network:
    driver: bridge