<div class="arcane-auth-page">
  <form class="grimoire-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="frame-corner corner-tl"></div>
    <div class="frame-corner corner-tr"></div>
    <div class="frame-corner corner-bl"></div>
    <div class="frame-corner corner-br"></div>

    <h1 class="form-title">Enter the Tower</h1>
    <p class="form-subtitle">Wizards and Tower Masters alike may pass.</p>

    <label class="field-label" for="email">Email</label>
    <input
      id="email"
      type="email"
      class="field-input"
      formControlName="email"
      autocomplete="email"
    />
    <p class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
      A valid sigil (email) is required to pass.
    </p>

    <label class="field-label" for="password">Password</label>
    <input
      id="password"
      type="password"
      class="field-input"
      formControlName="password"
      autocomplete="current-password"
    />
    <p
      class="field-error"
      *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
    >
      Your incantation (password) must be at least 8 characters.
    </p>

    <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="arcane-button" [disabled]="loading">
      {{ loading ? "Opening the gate..." : "Enter" }}
    </button>

    <p class="form-footer">New to the order? <a routerLink="/register">Register here</a></p>
  </form>
</div>
