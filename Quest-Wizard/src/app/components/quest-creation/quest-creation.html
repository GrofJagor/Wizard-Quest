<div class="creation-page">
  <form class="grimoire-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="frame-corner corner-tl"></div>
    <div class="frame-corner corner-tr"></div>
    <div class="frame-corner corner-bl"></div>
    <div class="frame-corner corner-br"></div>

    <h1 class="form-title">Post a New Quest</h1>

    <label class="field-label">Title</label>
    <input class="field-input" formControlName="title" />

    <label class="field-label">Difficulty</label>
    <select class="field-input" formControlName="level">
      <option *ngFor="let lvl of levels" [value]="lvl">{{ lvl }}</option>
    </select>

    <label class="field-label">Patron</label>
    <input class="field-input" formControlName="patron" />

    <label class="field-label">Description</label>
    <textarea class="field-input field-textarea" formControlName="description"></textarea>

    <label class="field-label">Reward</label>
    <input class="field-input" type="number" min="0" formControlName="reward" />

    <label class="field-checkbox">
      <input type="checkbox" formControlName="open" />
      Open for any wizard to join
    </label>

    <div class="assignment-section" *ngIf="!isOpen">
      <h2 class="section-title">Assign Wizards Directly</h2>
      <p class="section-hint">
        This quest will start <strong>in progress</strong> immediately with the wizards you
        select below — no open/join phase. Only wizards not already committed to another
        in-progress quest are shown.
      </p>
      <app-wizard-list
        [wizards]="availableWizards"
        [selectable]="true"
        (selectionChange)="onWizardSelectionChange($event)"
      ></app-wizard-list>
      <p class="selection-count" *ngIf="selectedWizardIds.length > 0">
        {{ selectedWizardIds.length }} wizard(s) selected
      </p>
    </div>

    <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="arcane-button" [disabled]="loading">
      {{ loading ? "Posting..." : "Post Quest" }}
    </button>
  </form>
</div>
