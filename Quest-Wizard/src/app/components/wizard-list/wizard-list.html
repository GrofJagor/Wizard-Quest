<div class="wizard-search-container">
  <input 
    type="text" 
    class="wizard-search-input" 
    placeholder="Search wizards by name or affinity..." 
    (input)="onSearchChange($event)"
  />
</div>

<div class="wizard-list-wrap">
  <ng-container *ngIf="displayWizards$ | async as wizards">
    <ul class="wizard-list" *ngIf="wizards.length > 0; else noWizards">
      <li
        *ngFor="let wizard of wizards"
        class="wizard-item"
        [class.selected]="isSelected(wizard.id)"
        [class.clickable]="selectable"
        (click)="toggle(wizard.id)"
      >
        <input
          *ngIf="selectable"
          type="checkbox"
          class="wizard-checkbox"
          [checked]="isSelected(wizard.id)"
          (click)="$event.stopPropagation()"
          (change)="toggle(wizard.id)"
        />

        <span class="wizard-avatar" *ngIf="wizard.pictureUrl">
          <img [src]="wizard.pictureUrl" [alt]="wizard.name" />
        </span>
        <span class="wizard-avatar wizard-avatar-fallback" *ngIf="!wizard.pictureUrl">
          {{ initial(wizard.name) }}
        </span>

        <span class="wizard-info">
          <span class="wizard-name">{{ wizard.name }}</span>
          <span class="wizard-meta">Level {{ wizard.level }} · {{ wizard.affinity }}</span>
        </span>
      </li>
    </ul>

    <ng-template #noWizards>
      <p class="empty-note">No wizards available.</p>
    </ng-template>
  </ng-container>
</div>
