<p>navigation-bar works!</p>
<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo / Brand -->
    <a routerLink="/" class="navbar-logo">
      <span><fa-icon [icon]="wizardHatIcon" style="color: #6f42c1;"></fa-icon>Quest</span>Wizard
    </a>

    <!-- Hamburger Menu Icon for Mobile -->
    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Toggle navigation">
      <span class="bar" [class.open]="isMenuOpen"></span>
      <span class="bar" [class.open]="isMenuOpen"></span>
      <span class="bar" [class.open]="isMenuOpen"></span>
    </button>

    <!-- Navigation Links -->
    <ul class="nav-menu" [class.active]="isMenuOpen">
      <li class="nav-item">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
      </li>
      <li class="nav-item">
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      </li>
      <li class="nav-item">
        <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
      </li>
      <li class="nav-item">
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
      </li>
      <li class="nav-item">
        <a routerLink="/login" class="nav-btn" (click)="closeMenu()">Login</a>
      </li>
    </ul>
  </div>
  



  <div class="nav-links">
    <a routerLink="/quests" routerLinkActive="active">Quests</a>
    <a routerLink="/wizards" routerLinkActive="active">Wizards</a>
  </div>
 
  <div class="nav-auth" *ngIf="authService.currentUser$ | async as user; else guestLinks">
    <div class="user-chip">
      <img
        *ngIf="user.pictureUrl"
        class="user-avatar"
        [src]="user.pictureUrl"
        [alt]="user.name || user.email"
      />
      <div class="user-avatar user-avatar-fallback" *ngIf="!user.pictureUrl">
        {{ user.role === "TOWER" ? "T" : "W" }}
      </div>
      <span class="user-name">{{ user.name || user.email }}</span>
    </div>
    <button class="logout-button" (click)="logout()">Log out</button>
  </div>
 
  <ng-template #guestLinks>
    <div class="nav-auth">
      <a class="auth-link" routerLink="/login" routerLinkActive="active">Login</a>
      <a class="auth-link register-link" routerLink="/register" routerLinkActive="active">
        Register
      </a>
    </div>
  </ng-template>
</nav>
