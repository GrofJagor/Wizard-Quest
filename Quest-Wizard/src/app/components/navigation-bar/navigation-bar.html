<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-logo">
      <span><fa-icon [icon]="wizardHatIcon" style="color: #6f42c1;"></fa-icon>Quest</span>Wizard
    </a>

    <button
      class="menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation"
    >
      <span class="bar" [class.open]="isMenuOpen"></span>
      <span class="bar" [class.open]="isMenuOpen"></span>
      <span class="bar" [class.open]="isMenuOpen"></span>
    </button>

    <ul class="nav-menu" [class.active]="isMenuOpen">
      <li class="nav-item">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
          >Home</a
        >
      </li>
      <li class="nav-item">
        <a routerLink="/quests" routerLinkActive="active" (click)="closeMenu()">Quests</a>
      </li>
      <li class="nav-item">
        <a routerLink="/wizards" routerLinkActive="active" (click)="closeMenu()">Wizards</a>
      </li>
     
      <li class="nav-item">
        <a href= "https://www.reddit.com/r/wizardposting/" routerLinkActive="active" (click)="closeMenu()">Social <fa-icon [icon]="redditIcon"></fa-icon></a>
      </li>

      <ng-container *ngIf="authService.currentUser$ | async as user; else guestLinks">
        <li class="nav-item user-item">
          <a class="nav-item user-item" routerLink="/profile/{{user.id}}" routerLinkActive="active" (click)="closeMenu()">
          <img
            *ngIf="user.pictureUrl"
            class="nav-avatar"
            [src]="user.pictureUrl"
            [alt]="user.name || user.email"
          />
          <div class="nav-avatar nav-avatar-fallback" *ngIf="!user.pictureUrl">
            {{ user.role === "TOWER" ? "T" : "W" }}
          </div>
          <span class="nav-username">{{ user.name || user.email }}</span>
        </a>
        </li>
        <li class="nav-item">
          <button class="nav-btn" (click)="logout()">Logout</button>
        </li>
      </ng-container>

      <ng-template #guestLinks>
        <li class="nav-item">
          <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Login</a>
        </li>
        <li class="nav-item">
          <a routerLink="/register" class="nav-btn" (click)="closeMenu()">Register</a>
        </li>
      </ng-template>
    </ul>
  </div>
</nav>
